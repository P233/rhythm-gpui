[package]
name = "rhythm-gpui"
description = "Print-inspired vertical rhythm for gpui: baseline offsets computed from real font metrics"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/p233/rhythm-gpui"
documentation = "https://docs.rs/rhythm-gpui"
readme = "README.md"
keywords = ["gpui", "typography", "vertical-rhythm", "baseline", "layout"]
categories = ["gui", "graphics"]
authors = ["Peiwen Lu <hi@peiwen.lu>"]
# The README screenshot and the bundled shaping-test fonts stay out of the
# published package (the shaping suite skips itself when the fonts are
# absent); crates.io rewrites the relative screenshot link to the
# repository's raw URL at the published commit.
exclude = [
    "assets/demo.png",
    "tests/fonts/",
    ".github/",
    ".githooks/",
    ".gitignore",
    "rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["gpui"]
# The gpui integration (RhythmGrid, RhythmFont, RhythmDropCap, RhythmStyled,
# rhythm_frame, rhythm_overlay).
# Without it only the dependency-free rhythm math is built.
gpui = ["dep:gpui"]
# Enables gpui's headless layout harness for this crate's geometry tests.
test-support = ["gpui", "gpui/test-support"]

[dependencies]
gpui = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.5"
ureq = "2"

[[example]]
name = "demo"
required-features = ["gpui"]
test = true

[[example]]
name = "direct_paint"
required-features = ["gpui"]

# Real CoreText shaping needs the AppKit main thread, which the libtest
# harness does not provide; the suite runs as its own binary and self-skips
# off macOS or without the bundled fonts.
[[test]]
name = "shaping"
harness = false
required-features = ["gpui"]

[[bench]]
name = "resolve"
harness = false
required-features = ["gpui"]
